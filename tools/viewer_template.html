<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  /* Layout: the 3D view fills the left, a tour panel runs down the right and drops below the view on a phone.
     Chlorophyll green is the single accent; each stop carries the color that organelle has in the model. */
  :root {
    --bg: #f1f4ef; --scene: #e2e8e1; --panel: #fafcf9; --fg: #1b2921; --muted: #58685e;
    --line: #d3dcd4; --accent: #1c7447; --accent-fg: #f6fbf7; --dim: #c9d1ca;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111713; --scene: #1a221d; --panel: #18201b; --fg: #e5eee7; --muted: #9dafa3;
            --line: #2d3932; --accent: #62d394; --accent-fg: #0f1612; --dim: #3a4640; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
  .app { display: flex; height: 100%; }
  .view { position: relative; flex: 1 1 62%; min-width: 0; background: var(--scene); }
  .view canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .tag { position: absolute; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap;
         font-family: var(--display); font-weight: 700; font-size: 15px; padding: 3px 10px; border-radius: 999px;
         background: var(--panel); color: var(--fg); border: 2px solid var(--accent); box-shadow: 0 2px 8px rgb(0 0 0 / .18); }
  .hint { position: absolute; left: 10px; bottom: 10px; right: 10px; width: fit-content; font-size: 13px; color: var(--muted); pointer-events: none;
         background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 10px; border-radius: 999px; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  .panel { flex: 0 0 380px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
  header { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .views { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .views button { font-size: 15px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
  .views button:hover { border-color: var(--accent); }
  .views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .card { padding: 16px 22px; border-bottom: 1px solid var(--line); min-height: 132px; }
  .card h2 { font-family: var(--display); font-size: 22px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
  .card p { margin: 0; }
  .card .count { color: var(--muted); font-size: 14px; margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .card .count button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 2px 12px; font-size: 15px; }
  .card .count button:hover { border-color: var(--accent); }
  .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 1px solid rgb(0 0 0 / .25); }
  ol { list-style: none; margin: 0; padding: 8px 12px 16px; overflow-y: auto; flex: 1 1 auto; }
  ol button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; }
  ol button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  ol button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 700; }
  ol .n { width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-weight: 400; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 820px) {
    .app { flex-direction: column; height: auto; min-height: 100%; }
    .view { flex: none; height: 56vh; }
    .panel { flex: none; border-left: 0; border-top: 1px solid var(--line); }
    ol { overflow: visible; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="view" id="view">
    <div class="msg" id="msg">Loading the model…</div>
    <div class="tag" id="tag" hidden></div>
    <div class="hint">Drag to turn · scroll or pinch to zoom · right-drag or two fingers to slide</div>
  </div>
  <aside class="panel">
    <header>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </header>
    <div class="views">
      <button id="vAll">Whole model</button>
      <button id="vCell">Cell only</button>
      <button id="vKey" aria-pressed="true">Key shown</button>
    </div>
    <section class="card" aria-live="polite">
      <h2 id="cName">Take the tour</h2>
      <p id="cText">Pick a cell part below. The view flies to it and it lights up in the cell and in the key.</p>
      <div class="count"><button id="prev" aria-label="Previous part">←</button><span id="cCount"></span><button id="next" aria-label="Next part">→</button></div>
    </section>
    <ol id="list"></ol>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DATA = __DATA__;
const GLB = "__GLB__";

const $ = id => document.getElementById(id);
$('title').textContent = DATA.title; $('subtitle').textContent = DATA.subtitle;
const view = $('view'), tag = $('tag');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const hex = c => '#' + new THREE.Color().setRGB(c[0], c[1], c[2], THREE.LinearSRGBColorSpace).getHexString();
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { $('msg').textContent = 'This browser could not start 3D graphics. Try Chrome, Safari or Edge.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.25;   // the same view transform Blender uses
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.3, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.2; controls.maxDistance = 60;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a938c, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(8, 9, -5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(6, -2, 8); scene.add(fill);

function paint() { scene.background = new THREE.Color(css('--scene')); }
paint(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paint(); applyHighlight(); });

// ---- model ----
const nodes = {};                 // Blender object name (dots removed) -> Object3D
const parts = [];                 // every mesh with its own material copy and original color
const keyNodes = [];              // objects that sit on the key side of the model
const clean = n => n.replace(/\./g, '');
const bytes = Uint8Array.from(atob(GLB), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, '', gltf => {
  scene.add(gltf.scene);
  for (const node of gltf.scene.children) {
    nodes[node.name] = node;
    const box = new THREE.Box3().setFromObject(node);
    if (box.min.z > DATA.keySplitZ) keyNodes.push(node);
    node.traverse(m => {
      if (!m.isMesh) return;
      m.material = m.material.clone(); m.material.roughness = 0.6; m.material.metalness = 0;
      parts.push({ mesh: m, node, base: m.material.color.clone() });
    });
  }
  $('msg').remove();
  buildList(); frame('all', false); loop();
}, err => { $('msg').textContent = 'The model could not be read.'; console.error(err); });

const boxOf = names => { const b = new THREE.Box3(); names.forEach(n => nodes[clean(n)] && b.expandByObject(nodes[clean(n)])); return b; };

// ---- camera moves ----
let tween = null;
function flyTo(pos, target, animate = true) {
  if (!animate || calm) { camera.position.copy(pos); controls.target.copy(target); tween = null; return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur: 800 };
}
function fit(box, dir, pad = 1.12, animate = true) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const w = Math.max(s.z, s.x * 0.6), h = s.y;                      // the model faces +x, so width is along z
  const dist = Math.max(h / 2 / t, w / 2 / (t * camera.aspect)) * pad + s.x / 2;
  flyTo(c.clone().add(dir.clone().normalize().multiplyScalar(dist)), c, animate);
}
const FRONT = new THREE.Vector3(1, 0.06, -0.08), ANGLE = new THREE.Vector3(1, 0.28, -0.4);
let current = -1, mode = 'all';
function frame(which, animate = true) {
  mode = which;
  if (which === 'all') fit(new THREE.Box3().setFromObject(scene), FRONT, 1.08, animate);
  if (which === 'cell') fit(boxOf(['Sphere.018']), ANGLE, 1.15, animate);
}

// ---- tour ----
function buildList() {
  DATA.stops.forEach((s, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="n">${i + 1}</span><span class="sw" style="background:${hex(s.col)}"></span><span></span>`;
    b.lastChild.textContent = s.name;
    b.onclick = () => go(i);
    li.append(b); $('list').append(li);
  });
  $('cCount').textContent = `${DATA.stops.length} parts`;
}
function go(i) {
  const n = DATA.stops.length; current = ((i % n) + n) % n;
  const s = DATA.stops[current];
  $('cName').innerHTML = `<span class="sw" style="background:${hex(s.col)}"></span><span></span>`;
  $('cName').lastChild.textContent = s.name; $('cText').textContent = s.text;
  $('cCount').textContent = `${current + 1} of ${n}`;
  [...$('list').querySelectorAll('button')].forEach((b, k) => b.setAttribute('aria-current', k === current));
  applyHighlight();
  if (s.frame === 'cell') frame('cell');
  else {
    const c = s.center ? new THREE.Vector3(...s.center) : boxOf(s.cell).getCenter(new THREE.Vector3());
    const r = s.radius || boxOf(s.cell).getSize(new THREE.Vector3()).length() / 2;
    flyTo(c.clone().add(ANGLE.clone().normalize().multiplyScalar(Math.max(r * 4.2, 3.2))), c);
    mode = 'stop';
  }
}
function applyHighlight() {
  const s = DATA.stops[current];
  const lit = new Set(s ? [...s.cell, ...s.key].map(n => nodes[clean(n)]) : []);
  const dim = new THREE.Color(css('--dim'));
  for (const p of parts) {
    const on = !s || lit.has(p.node) || p.node.name === 'text' || p.node.name === 'Cube002';
    p.mesh.material.color.copy(p.base); if (!on) p.mesh.material.color.lerp(dim, 0.72);
    p.mesh.material.emissive.copy(s && lit.has(p.node) ? p.base : new THREE.Color(0)).multiplyScalar(0.22);
  }
  tag.hidden = !s; if (s) tag.textContent = s.name;
}
function tagPoint() {
  const s = DATA.stops[current]; if (!s) return null;
  if (s.center) return new THREE.Vector3(s.center[0], s.center[1] + s.radius * 0.9, s.center[2]);
  const b = boxOf(s.cell.slice(0, 1)); const c = b.getCenter(new THREE.Vector3()); if (s.frame === 'cell' && s.cell.length === 1) c.y = b.max.y; return c;
}

$('vAll').onclick = () => { setKey(true); frame('all'); };
$('vCell').onclick = () => frame('cell');
$('vKey').onclick = () => setKey($('vKey').getAttribute('aria-pressed') !== 'true');
function setKey(on) { keyNodes.forEach(n => n.visible = on); $('vKey').setAttribute('aria-pressed', on); $('vKey').textContent = on ? 'Key shown' : 'Key hidden'; if (!on && mode === 'all') frame('cell'); }
$('prev').onclick = () => go(current < 0 ? DATA.stops.length - 1 : current - 1);
$('next').onclick = () => go(current + 1);
addEventListener('keydown', e => {
  if (e.target.closest('button, a')) return;
  if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click();
});
controls.addEventListener('start', () => { tween = null; });

// ---- frame loop ----
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (renderer.domElement.width !== Math.round(w * renderer.getPixelRatio()) || renderer.domElement.height !== Math.round(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (mode !== 'stop' && !tween) frame(mode, false);
  }
}
const v = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop); resize();
  if (tween) {
    let k = Math.min(1, (performance.now() - tween.start) / tween.dur); k = k * k * (3 - 2 * k);
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (k === 1) tween = null;
  }
  controls.update(); renderer.render(scene, camera);
  const p = tagPoint();
  if (p) { v.copy(p).project(camera); tag.style.transform = `translate(-50%, -130%) translate(${(v.x + 1) / 2 * view.clientWidth}px, ${(1 - v.y) / 2 * view.clientHeight}px)`; tag.style.visibility = v.z < 1 ? 'visible' : 'hidden'; }
}
window.__viewer = { go, frame, ready: () => parts.length > 0 };
</script>
</body>
</html>
